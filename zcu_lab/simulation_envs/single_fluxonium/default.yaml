# Illustrative single-fluxonium model. Basis/solver convergence is user-owned.
format: zcu.single-fluxonium
version: 1

chip:
  qubit:
    ej_ghz: 4.0
    ec_ghz: 1.0
    el_ghz: 1.0
    q_cap: 1000000.0
    q_ind: 100000000.0
    xqp: 0.0000002
    aphi: 0.000002
  temperature_k: 0.05

dc_bias:
  offset_phi0: 0.5
  source:
    name: flux_bias
    unit: A
    limits: [-0.02, 0.02]
    initial: 0.0
    ramp_step: 0.000001
    flux_per_unit: 100.0 # Phi0/A, one period is 10 mA.

drive_line:
  name: q1_charge
  gen_ch: 1
  charge_drive_ghz_per_gain: {real: 0.1, imag: 0.0} # Full charge n.

flux_line:
  name: q1_fastflux
  gen_ch: 2
  flux_phi0_per_gain: 0.2
  delay_ns: 5.0
  tau_ns: 2.0
  distortion_terms:
    - {amplitude: 0.08, tau_ns: 40.0}
    - {amplitude: -0.03, tau_ns: 200.0}

readout:
  drive:
    gen_ch: 0
    input_per_gain: 10.0 # sqrt(photons/ns)/gain
  resonator:
    frequency_ghz: 7.0
    charge_coefficient_ghz: 0.03 # Full-charge coupling, GHz.
    kappa_external_mhz: 1.0 # kappa_external/(2*pi), MHz
    kappa_internal_mhz: 0.1
    thermal_occupation: 0.0
    mismatch_phase_rad: 0.0
  adc:
    ro_ch: 0
    gain: 100.0 # ADC sample units / sqrt(photons/ns)
    phase_deg: 0.0
    time_of_flight_ns: 400.0
    offset_adc: [0.0, 0.0]
    noise_psd_adc2_ns: [[1.0, 0.2], [0.2, 1.0]] # ADC^2*ns, two-sided PSD.

numerics:
  # Midpoint full-Hamiltonian steps per carrier period below 30 MHz.
  slow_envelope_segments_per_period: 20
  truncation:
    native_cutoff: 40 # Harmonic-oscillator dimension.
    # Fixed DC-reference space. Lowest three projected energies differ by
    # <10 kHz from direct diagonalization at 21 flux points in 0.5..0.7 Phi0.
    levels: 21
  solver:
    rtol: 0.00000001
    atol: 0.0000000001
    max_step_ns: 0.1
    bath_segment_ns: 2.0
  seed: 123
  min_round_duration_s: 0.2
