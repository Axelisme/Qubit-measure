# Entry values in working units, matching the illustrative default.yaml model.
# No module library or calibrated measurement defaults are supplied.
format: zcu.entry-template
format_version: "1.0"
components:
  Q1:
    kind: qubit/fluxonium
    EJ: 6.27 # GHz
    EC: 1.41
    EL: 0.80
    freq: null # Bias-dependent; not given by the physical settings.
    resonator: R1
    flux_source: f1_bias
    flux_unit: A
    wiring:
      ch: 2
  Q2:
    kind: qubit/fluxonium
    EJ: 5.71 # GHz
    EC: 1.30
    EL: 0.59
    freq: null
    resonator: R2
    flux_source: f2_bias
    flux_unit: A
    wiring:
      ch: 2 # Shared microwave line; all three loops have real 0.1 GHz/gain.
  coupler:
    kind: qubit/transmon
    EJmax: 16.4 # GHz
    EC: 0.32
    d: 0.58536585
    freq: null
    flux_source: coupler_bias
    flux_unit: A
  R1:
    kind: resonator
    freq: 7190.0 # MHz; model resonator r1 is 7.19 GHz.
    wiring:
      ch: 0
      ro_ch: 0
  R2:
    kind: resonator
    freq: 7080.0 # MHz; model resonator r2 is 7.08 GHz.
    wiring:
      ch: 0
      ro_ch: 0
aliases:
  format: zcu.aliases
  format_version: "1.0"
  aliases:
    qubit: Q1
    resonator: $qubit.resonator
    flux_dev: $qubit.flux_source
    qubit1: Q1
    qubit2: Q2
    coupler: coupler
    coupler_flux_dev: $coupler.flux_source
