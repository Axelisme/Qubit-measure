# Entry values in working units, matching the illustrative default.yaml model.
# No module library or calibrated measurement defaults are supplied.
format: zcu.entry-template
format_version: "1.0"
components:
  Q1:
    kind: qubit/fluxonium
    freq: null # Bias-dependent; not given by the physical settings.
    resonator: R1
    flux_source: f1_bias
    flux_unit: A
    wiring:
      ch: 2
  Q2:
    kind: qubit/fluxonium
    freq: null
    resonator: R2
    flux_source: f2_bias
    flux_unit: A
    wiring:
      ch: 3 # F2 charge line; coupler crosstalk is real 0.01 GHz/gain.
  coupler:
    kind: qubit/transmon
    freq: null
    flux_source: coupler_bias
    flux_unit: A
  R1:
    kind: resonator
    wiring:
      ch: 0
      ro_ch: 0
  R2:
    kind: resonator
    wiring:
      ch: 0
      ro_ch: 0
  MG12:
    kind: group/mux
    resonators: [R1, R2]
    qubits: [Q1, Q2]
    wiring:
      gen_ch: 1
      ro_ch: [1, 2] # R1/R2 mux ADCs; pulse wiring remains gen0/ADC0.
    # No module slot is supplied because this template carries no library assets.
aliases:
  format: zcu.aliases
  format_version: "1.0"
  aliases:
    mux: MG12
    qubit: Q1
    resonator: $qubit.resonator
    flux_dev: $qubit.flux_source
    qubit1: Q1
    qubit2: Q2
    coupler: coupler
    coupler_flux_dev: $coupler.flux_source
