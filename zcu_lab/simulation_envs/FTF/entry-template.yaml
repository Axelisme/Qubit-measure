# Entry values in working units, matching the illustrative default.yaml model.
# No module library or calibrated measurement defaults are supplied.
format: zcu.entry-template
format_version: "1.0"
components:
  Q1:
    kind: qubit/fluxonium
    EJ: 8.0 # GHz
    EC: 1.0
    EL: 0.5
    freq: null # Bias-dependent; not given by the physical settings.
    resonator: R1
    flux_source: f1_bias
    flux_unit: V
    wiring:
      ch: 2
  Q2:
    kind: qubit/fluxonium
    EJ: 8.6 # GHz
    EC: 0.9
    EL: 0.55
    freq: null
    resonator: R2
    flux_source: f2_bias
    flux_unit: V
    wiring:
      ch: 2 # Shared microwave line; F2 sees its small crosstalk coefficient.
  coupler:
    kind: qubit/transmon
    EJmax: 12.0 # GHz
    EC: 0.3
    d: 0.15
    freq: null
    flux_source: coupler_bias
    flux_unit: V
    wiring:
      lo_flux_ch: 1
  R1:
    kind: resonator
    freq: 6000.0 # MHz; model resonator 1 is 6.0 GHz.
    wiring:
      ch: 0
      ro_ch: 0
  R2:
    kind: resonator
    freq: 6200.0 # MHz; model resonator 2 is 6.2 GHz.
    wiring:
      ch: 0
      ro_ch: 0
aliases:
  format: zcu.aliases
  format_version: "1.0"
  aliases:
    qubit: Q1
    resonator: $qubit.resonator
    flux_dev: $qubit.flux_source
    control: Q1
    target: Q2
    coupler: coupler
    coupler_flux_dev: $coupler.flux_source
