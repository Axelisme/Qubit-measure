# Entry working values for the illustrative ftf.yaml model; no module library.
# simulated-truth: DC calibrations use offset_phi0 and each loop's own source
# coefficient, with all other sources at zero: int=-offset/coefficient,
# period=1/coefficient, half=(0.5-offset)/coefficient. Units: A.
# Resonator freq/kappa and route TOF come from readout settings, not measurements.
format: zcu.entry-template
format_version: "1.0"
components:
  Q1:
    kind: qubit/fluxonium
    freq: null # Bias-dependent; not given by the physical settings.
    resonator: R1
    flux_source: f1_bias
    flux_unit: A
    flux_half: 0.00015600624024961015
    flux_period: 0.0078003120124804995
    flux_int: -0.00374414976599064
    wiring:
      ch: 2
  Q2:
    kind: qubit/fluxonium
    freq: null
    resonator: R2
    flux_source: f2_bias
    flux_unit: A
    flux_half: 0.00008196721311475417
    flux_period: 0.00819672131147541
    flux_int: -0.0040163934426229505
    wiring:
      ch: 3 # F2 charge line; coupler crosstalk is real 0.01 GHz/gain.
  coupler:
    kind: qubit/transmon
    freq: null
    flux_source: coupler_bias
    flux_unit: A
    flux_half: 0.0024
    flux_period: 0.008
    flux_int: -0.0016
  R1:
    kind: resonator
    freq: 7190.0 # MHz; readout.resonators.r1.frequency_ghz * 1000.
    kappa: 1.1 # MHz; kappa_external_mhz + kappa_internal_mhz.
    time_of_fly: 0.4 # us; pulse ADC time_of_flight_ns / 1000.
    wiring:
      ch: 0
      ro_ch: 0
  R2:
    kind: resonator
    freq: 7080.0 # MHz; readout.resonators.r2.frequency_ghz * 1000.
    kappa: 1.1 # MHz; kappa_external_mhz + kappa_internal_mhz.
    time_of_fly: 0.4 # us; pulse ADC time_of_flight_ns / 1000.
    wiring:
      ch: 0
      ro_ch: 0
  MG12:
    kind: group/mux
    mixer_freq: 7135 # MHz; mux generator LO setting.
    time_of_fly: 0.4 # us; mux route, separate from resonator pulse routes.
    resonators: [R1, R2]
    qubits: [Q1, Q2]
    wiring:
      gen_ch: 1
      ro_ch: [1, 2] # R1/R2 mux ADCs; pulse wiring remains gen0/ADC0.
    # No module slot is supplied because this template carries no library assets.
aliases:
  format: zcu.aliases
  format_version: "1.0"
  aliases:
    mux: MG12
    qubit: Q1
    resonator: $qubit.resonator
    flux_dev: $qubit.flux_source
    qubit1: Q1
    qubit2: Q2
    f1: Q1
    f2: Q2
    coupler: coupler
    coupler_flux_dev: $coupler.flux_source
