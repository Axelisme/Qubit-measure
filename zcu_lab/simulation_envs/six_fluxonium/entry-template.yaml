# Entry working values and wiring, separate from physical simulation settings.
# No module library or pulse sequence is supplied.
# simulated-truth: default.yaml dc_bias offsets/periods in A, per line's own
# reference: integer=offset, half=offset+period/2 for local and coil devices.
# All devices at their integer references give zero total reduced flux.
# Resonator kappa and route TOF come from readout settings, not measurements.
format: zcu.entry-template
format_version: "1.0"
schema_version: 2
components:
  Q1:
    kind: qubit/fluxonium
    EJ: 4.0 # GHz
    EC: 1.0
    EL: 1.0
    freq: null # Measure the bias-dependent transition before excitation.
    resonator: R1
    flux_source: Q1_bias
    flux:
      Q1_bias: {half: 0.0, integer: -0.001, period: 0.002}
      coil_bias: {half: 0.005, integer: 0.0, period: 0.01}
    wiring:
      ch: 1
  R1:
    kind: resonator
    time_of_fly: 0.4 # us; readout.adc.time_of_flight_ns / 1000.
    kappa: 1.1 # MHz; kappa_external_mhz + kappa_internal_mhz.
    freq: 7000.0 # MHz
    wiring:
      ch: 13 # Shared pulse readout, separate from the mux group.
      ro_ch: 6
  Q2:
    kind: qubit/fluxonium
    EJ: 4.5 # GHz
    EC: 0.9
    EL: 0.8
    freq: null # Measure the bias-dependent transition before excitation.
    resonator: R2
    flux_source: Q2_bias
    flux:
      Q2_bias: {half: 0.000125, integer: -0.001125, period: 0.0025}
      coil_bias: {half: 0.00625, integer: 0.0, period: 0.0125}
    wiring:
      ch: 2
  R2:
    kind: resonator
    time_of_fly: 0.4 # us; readout.adc.time_of_flight_ns / 1000.
    kappa: 1.1 # MHz; kappa_external_mhz + kappa_internal_mhz.
    freq: 7100.0 # MHz
    wiring:
      ch: 13 # Shared pulse readout, separate from the mux group.
      ro_ch: 6
  Q3:
    kind: qubit/fluxonium
    EJ: 5.0 # GHz
    EC: 1.1
    EL: 0.6
    freq: null # Measure the bias-dependent transition before excitation.
    resonator: R3
    flux_source: Q3_bias
    flux:
      Q3_bias: {half: -0.00009, integer: -0.00099, period: 0.0018}
      coil_bias: {half: 0.004166666666666667, integer: 0.0, period: 0.008333333333333333}
    wiring:
      ch: 3
  R3:
    kind: resonator
    time_of_fly: 0.4 # us; readout.adc.time_of_flight_ns / 1000.
    kappa: 1.1 # MHz; kappa_external_mhz + kappa_internal_mhz.
    freq: 7200.0 # MHz
    wiring:
      ch: 13 # Shared pulse readout, separate from the mux group.
      ro_ch: 6
  Q4:
    kind: qubit/fluxonium
    EJ: 3.5 # GHz
    EC: 1.0
    EL: 1.2
    freq: null # Measure the bias-dependent transition before excitation.
    resonator: R4
    flux_source: Q4_bias
    flux:
      Q4_bias: {half: 0.00022, integer: -0.00088, period: 0.0022}
      coil_bias: {half: 0.005555555555555556, integer: 0.0, period: 0.011111111111111112}
    wiring:
      ch: 4
  R4:
    kind: resonator
    time_of_fly: 0.4 # us; readout.adc.time_of_flight_ns / 1000.
    kappa: 1.1 # MHz; kappa_external_mhz + kappa_internal_mhz.
    freq: 7300.0 # MHz
    wiring:
      ch: 13 # Shared pulse readout, separate from the mux group.
      ro_ch: 6
  Q5:
    kind: qubit/fluxonium
    EJ: 6.0 # GHz
    EC: 0.8
    EL: 0.5
    freq: null # Measure the bias-dependent transition before excitation.
    resonator: R5
    flux_source: Q5_bias
    flux:
      Q5_bias: {half: -0.00028, integer: -0.00168, period: 0.0028}
      coil_bias: {half: 0.004545454545454545, integer: 0.0, period: 0.00909090909090909}
    wiring:
      ch: 5
  R5:
    kind: resonator
    time_of_fly: 0.4 # us; readout.adc.time_of_flight_ns / 1000.
    kappa: 1.1 # MHz; kappa_external_mhz + kappa_internal_mhz.
    freq: 7400.0 # MHz
    wiring:
      ch: 13 # Shared pulse readout, separate from the mux group.
      ro_ch: 6
  Q6:
    kind: qubit/fluxonium
    EJ: 4.2 # GHz
    EC: 1.2
    EL: 0.9
    freq: null # Measure the bias-dependent transition before excitation.
    resonator: R6
    flux_source: Q6_bias
    flux:
      Q6_bias: {half: 0.0, integer: -0.0015, period: 0.003}
      coil_bias: {half: 0.007142857142857143, integer: 0.0, period: 0.014285714285714285}
    wiring:
      ch: 6
  R6:
    kind: resonator
    time_of_fly: 0.4 # us; readout.adc.time_of_flight_ns / 1000.
    kappa: 1.1 # MHz; kappa_external_mhz + kappa_internal_mhz.
    freq: 7500.0 # MHz
    wiring:
      ch: 13 # Shared pulse readout, separate from the mux group.
      ro_ch: 6
  Q1_bias:
    kind: device/current_source
  Q2_bias:
    kind: device/current_source
  Q3_bias:
    kind: device/current_source
  Q4_bias:
    kind: device/current_source
  Q5_bias:
    kind: device/current_source
  Q6_bias:
    kind: device/current_source
  coil_bias:
    kind: device/current_source
  MG123456:
    kind: group/mux
    mixer_freq: 7250 # MHz; mux generator LO setting.
    time_of_fly: 0.4 # us; mux route, separate from resonator pulse routes.
    resonators: [R1, R2, R3, R4, R5, R6]
    qubits: [Q1, Q2, Q3, Q4, Q5, Q6]
    flux_source: coil_bias
    wiring:
      gen_ch: 0
      ro_ch: [0, 1, 2, 3, 4, 5]
aliases:
  format: zcu.aliases
  format_version: "1.0"
  aliases:
    mux: MG123456
    qubit: Q1
    resonator: $qubit.resonator
