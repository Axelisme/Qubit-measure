# Six independent single-cavity models. Recheck basis convergence after edits.
format: zcu.six-fluxonium
version: 1
mux_gen_ch: 0
pulse_gen_ch: 13
pulse_ro_ch: 6
# Environment totals for prepare/results/routing; ADC bytes apply per source.
numerics:
  # Midpoint full-Hamiltonian steps per carrier period below 30 MHz, all qubits.
  slow_envelope_segments_per_period: 20
  prepare_cache_bytes: 805306368  # 768 MiB total, 128 MiB per source
  result_memo_bytes: 67108864     # 64 MiB total
  routing_cache_bytes: 4194304    # 4 MiB total
  adc_cache_bytes: 8388608        # 8 MiB per source
dc_source:
  name: coil_bias
  unit: A
  limits: [-0.02, 0.02]
  initial: 0.0
  ramp_step: 0.000001
qubits:
  Q1:
    format: zcu.single-fluxonium
    version: 1

    chip:
      qubit:
        ej_ghz: 4.0
        ec_ghz: 1.0
        el_ghz: 1.0
        q_cap: 1000000.0
        q_ind: 100000000.0
        xqp: 0.0000002
        aphi: 0.000002
      temperature_k: 0.05

    dc_bias:
      source:
        name: Q1_bias
        unit: A
        limits: [-0.02, 0.02]
        initial: 0.0
        ramp_step: 0.000001
      offset: -0.001 # Local zero-flux current, A.
      period: 0.002 # Local current per Phi0, A.
      coil_offset: 0.0 # Coil zero-flux current, A.
      coil_period: 0.01 # Coil current per Phi0, A.

    drive_line:
      name: q1_charge
      gen_ch: 1
      charge_drive_ghz_per_gain: {real: 0.1, imag: 0.0} # Full charge n.

    readout:
      drive:
        gen_ch: 0
        input_per_gain: 10.0 # sqrt(photons/ns)/gain
      resonator:
        frequency_ghz: 7.00
        charge_coefficient_ghz: 0.03 # Full-charge coupling, GHz.
        kappa_external_mhz: 1.0 # kappa_external/(2*pi), MHz
        kappa_internal_mhz: 0.1
        thermal_occupation: 0.0
        mismatch_phase_rad: 0.2
      adc:
        ro_ch: 0
        gain: 100.0 # ADC sample units / sqrt(photons/ns)
        phase_deg: 0.0
        time_of_flight_ns: 400.0
        background:
          ripple_depth: 0.05
          ripple_period_mhz: 68.0
          ripple_phase_deg: 0.0
          slope_db_per_ghz: -4.0
          pivot_ghz: 7.0
          extra_ripples:
            - {depth: 0.04, period_mhz: 44.0, phase_deg: 25.0}
            - {depth: 0.03, period_mhz: 308.0, phase_deg: -40.0}
          roughness: {amplitude: 0.02, correlation_mhz: 50.0, seed: 82}
          band_edges:
            low: {corner_ghz: 3.7, rolloff_db_per_ghz: 100.0}
        offset_adc: [0.0, 0.0]
        noise_psd_adc2_ns: [[1.0, 0.2], [0.2, 1.0]] # ADC^2*ns, two-sided PSD.

    numerics:
      truncation:
        native_cutoff: 40 # Harmonic-oscillator dimension.
        # Fixed DC-reference space; convergence must be checked per circuit.
        levels: 21
      solver:
        rtol: 0.00000001
        atol: 0.0000000001
        max_step_ns: 0.1
        bath_segment_ns: 2.0
      seed: 123
      time_scale: 1.0
  Q2:
