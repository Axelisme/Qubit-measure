# Source: bitfiles/qick_216_v2.hwh, interpreted with QICK 0.2.436 driver rules.
# This compile-only profile uses the current build_soccfg schema, not a full
# hardware topology. These five departures from the HWH remain:
# (a) Dyn readouts use consecutive control ports 16 and 17, rather than sharing
#     port 12 with mixmux8 through tmux_ch 0/1/2. tmux_ch remains null.
# (b) Readout triggers use dport instead of hardware tport 10..19, bit 0.
#     Dyn readouts use dport 0; PFB uses placeholder dport 1 so its bits 0..7
#     do not collide with the dyn readouts' bits 0 and 1.
# (c) DAC/ADC names are consecutive, not hardware DACs 20..23, 00..13, 30..33
#     and ADCs 20, 21, 22. Each PFB output has its own ADC name, rather than
#     all eight outputs sharing hardware ADC 21.
# (d) PFB readback tproc_ch values are consecutive; hardware readouts 8 and 9
#     instead have tproc_ch -1.
# (e) Dyn readout b_phase (32 in hardware) remains null.
# Generator samps_per_clk, maxlen, complex_env and maxv_scale retain the
# compile placeholders for mixmux8. RF clock groups and tProc pins remain
# untraced placeholders.
# PFB decimation remains provisional here: HWH C_ADC_Decimation_Mode21=2;
# not verified on the board. Derived PFB rates remain provisional too.
