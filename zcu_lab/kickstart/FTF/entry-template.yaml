# Entry values in working units, matching the illustrative default.yaml model.
# No module library or calibrated measurement defaults are supplied.
format: zcu.entry-template
format_version: "1.0"
schema_version: 3
components:
  Q1:
    kind: qubit/fluxonium
    EJ: 6.27 # GHz
    EC: 1.41
    EL: 0.80
    freq: null # Bias-dependent; not given by the physical settings.
    resonator: R1
    flux_dev: f1_bias
    flux: {offset: null, period: {}}
    wiring:
      ch: 2
  Q2:
    kind: qubit/fluxonium
    EJ: 5.71 # GHz
    EC: 1.30
    EL: 0.59
    freq: null
    resonator: R2
    flux_dev: f2_bias
    flux: {offset: null, period: {}}
    wiring:
      ch: 3 # F2 charge line; coupler crosstalk is real 0.01 GHz/gain.
  coupler:
    kind: qubit/transmon
    EJmax: 16.4 # GHz
    EC: 0.32
    d: 0.58536585
    freq: null
    flux_dev: coupler_bias
    flux: {offset: null, period: {}}
  R1:
    kind: resonator
    time_of_fly: null # us; measure the single-tone readout route.
    freq: 7190.0 # MHz; model resonator r1 is 7.19 GHz.
    wiring:
      ch: 0
      ro_ch: 0
  R2:
    kind: resonator
    time_of_fly: null # us; measure the single-tone readout route.
    freq: 7080.0 # MHz; model resonator r2 is 7.08 GHz.
    wiring:
      ch: 0
      ro_ch: 0
  MG12:
    kind: group/mux
    mixer_freq: 7135 # MHz; mux generator LO setting.
    time_of_fly: null # us; mux route, separate from resonator pulse routes.
    resonators: [R1, R2]
    qubits: [Q1, Q2]
    wiring:
      gen_ch: 1
      ro_ch: [1, 2] # R1/R2 mux ADCs; pulse wiring remains gen0/ADC0.
    # No module slot is supplied because this template carries no library assets.
aliases:
  format: zcu.aliases
  format_version: "1.0"
  aliases:
    mux: MG12
    qubit: Q1
    resonator: $qubit.resonator
    qubit1: Q1
    qubit2: Q2
    f1: Q1
    f2: Q2
    coupler: coupler
